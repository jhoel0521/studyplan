# Release firmado de StudyPlan (RNF-15, RNF-16).
# Al empujar una etiqueta vX.Y.Z compila un AAB y un APK firmados con la clave de subida y crea un BORRADOR de
# GitHub Release (no público). La clave y las contraseñas viven solo en los secretos del repositorio:
# KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS y KEY_PASSWORD. Se crean y cargan a mano (ver README).
# Las versiones de las acciones de terceros están por verificar a mano (ver la bitácora de auditoría IA).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: AAB y APK firmados
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Descargar el código con su historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar la etiqueta y calcular la versión
        id: version
        env:
          ETIQUETA: ${{ github.ref_name }}
        run: |
          if ! [[ "$ETIQUETA" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::La etiqueta '$ETIQUETA' no tiene el formato vX.Y.Z"
            exit 1
          fi
          X="${BASH_REMATCH[1]}"; Y="${BASH_REMATCH[2]}"; Z="${BASH_REMATCH[3]}"
          if [ "$Y" -gt 999 ] || [ "$Z" -gt 999 ]; then
            echo "::error::La versión menor y el parche no pueden pasar de 999"
            exit 1
          fi
          echo "nombre=$X.$Y.$Z" >> "$GITHUB_OUTPUT"
          echo "codigo=$((X * 1000000 + Y * 1000 + Z))" >> "$GITHUB_OUTPUT"

      - name: Comprobar que la etiqueta está en main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::La etiqueta no apunta a una confirmación de main; no se firma"
            exit 1
          fi

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle con caché
        uses: gradle/actions/setup-gradle@v4

      - name: Aceptar las licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pruebas y lint antes de firmar
        run: ./gradlew test lint

      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "STUDYPLAN_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Compilar el AAB y el APK firmados
        env:
          STUDYPLAN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STUDYPLAN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STUDYPLAN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NOMBRE: ${{ steps.version.outputs.nombre }}
          VERSION_CODIGO: ${{ steps.version.outputs.codigo }}
        run: ./gradlew bundleRelease assembleRelease -PversionName="$VERSION_NOMBRE" -PversionCode="$VERSION_CODIGO"

      - name: Verificar la firma del APK
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify app/build/outputs/apk/release/app-release.apk

      - name: Borrar la clave del ejecutor
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Subir los artefactos
        uses: actions/upload-artifact@v4
        with:
          name: studyplan-${{ steps.version.outputs.nombre }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Crear el borrador de GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ github.ref_name }}
        run: |
          gh release create "$ETIQUETA" --draft --generate-notes --title "StudyPlan $ETIQUETA" \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/apk/release/app-release.apk
