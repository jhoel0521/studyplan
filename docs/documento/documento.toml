# Configuración del documento. NO pongas aquí datos personales: usa {{CLAVE}} y el archivo .env.

[kit]
tipo = "libre"
descripcion = "Documento APA 7 con el índice que dicte tu institución: el agente lo arma contigo. Sin numerar, sin saltos."
version_kit = "0.2.0"

[documento]
titulo = "StudyPlan: Aplicación Móvil Android para Gestionar y Planificar el Tiempo de Estudio del Estudiante Universitario"
subtitulo = "Entrega final: diseño, respaldo en Google Drive y publicación en Google Play"
salida = "StudyPlan_Entrega2"                     # dist/Documento.docx
papel = "carta"                          # carta | a4 | oficio
fuente = "Times New Roman"               # APA 7 admite también Calibri 11 o Arial 11
tamano = 12
idioma = "es-BO"
justificar = false
numerar_titulos = true                  # true para Capítulo N. / N.M. automáticos
salto_nivel1 = true                     # true para que cada título de nivel 1 empiece página
etiqueta_seccion = "Capítulo"
niveles_indice = 3
etiqueta_tabla = "Tabla"
etiqueta_figura = "Figura"
logo = "recursos/logos/logo.png"
logo_ancho_cm = 7

[portada]
espacios_arriba = 1
lineas = [
  "{{AUTOR}}",
  "{{FACULTAD}}, {{UNIVERSIDAD}}",
  "{{SIGLA}}: {{MATERIA}}",
  "{{DOCENTE}}",
  "{{FECHA_ENTREGA}}",
]

[preliminares]
orden = ["portada", "previos", "lista_tablas", "lista_figuras", "indice"]

[variables]
